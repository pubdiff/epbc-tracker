name: test

# Typecheck + unit tests for the pipeline logic (dedup, donations matching,
# health guardrail). Runs on every push and PR so a regression in the
# data-shaping code is caught before the weekly scrape relies on it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm run typecheck
      - name: unit tests
        run: pnpm test
